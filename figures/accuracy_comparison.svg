
    <svg xmlns="http://www.w3.org/2000/svg"
         width="900" height="500"
         viewBox="0 0 900 500">

        <rect width="100%" height="100%" fill="white"/>

        <g font-family="Arial, sans-serif">
            
    <text x="450" y="35" text-anchor="middle"
          font-size="24" font-weight="bold">
        Accuracy Comparison
    </text>
    
        <line x1="90" y1="400"
