        </text>
        
        <rect x="395" y="102.22634509"
              width="140" height="297.77365491"
              fill="#2563eb" rx="4"/>

        <text x="465" y="90.22634509"
              text-anchor="middle"
              font-size="18" font-weight="bold">
            99.26%
        </text>

        <text x="465" y="430"
              text-anchor="middle" font-size="14">
            Training Accuracy
        </text>
        
        <rect x="635" y="102.22222222000005"
              width="140" height="297.77777777999995"
              fill="#16a34a" rx="4"/>

        <text x="705" y="90.22222222000005"
              text-anchor="middle"
              font-size="18" font-weight="bold">
            99.26%
        </text>

        <text x="705" y="430"
              text-anchor="middle" font-size="14">
            Test Accuracy
        </text>
        
    <text x="25" y="250"
          transform="rotate(-90 25 250)"
          text-anchor="middle" font-size="15">
        Accuracy (%)
    </text>
    
        </g>

    </svg>
    