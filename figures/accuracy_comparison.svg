              stroke="#e2e8f0"/>

        <text x="78" y="404"
              text-anchor="end" font-size="12">
            0%
        </text>
        
        <line x1="90" y1="340"
              x2="850" y2="340"
              stroke="#e2e8f0"/>

        <text x="78" y="344"
              text-anchor="end" font-size="12">
            20%
        </text>
        
        <line x1="90" y1="280"
              x2="850" y2="280"
              stroke="#e2e8f0"/>

        <text x="78" y="284"
              text-anchor="end" font-size="12">
            40%
        </text>
        
        <line x1="90" y1="220"
              x2="850" y2="220"
              stroke="#e2e8f0"/>

        <text x="78" y="224"
              text-anchor="end" font-size="12">
            60%
        </text>
        
        <line x1="90" y1="160"
              x2="850" y2="160"
              stroke="#e2e8f0"/>

        <text x="78" y="164"
              text-anchor="end" font-size="12">
            80%
        </text>
        
        <line x1="90" y1="100"
              x2="850" y2="100"
              stroke="#e2e8f0"/>

        <text x="78" y="104"
              text-anchor="end" font-size="12">
            100%
        </text>
        
        <rect x="155" y="235.80705009999997"
              width="140" height="164.19294990000003"
              fill="#94a3b8" rx="4"/>

        <text x="225" y="223.80705009999997"
              text-anchor="middle"
              font-size="18" font-weight="bold">
            54.73%
        </text>

        <text x="225" y="430"
              text-anchor="middle" font-size="14">
